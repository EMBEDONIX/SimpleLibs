name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }} examples=${{ matrix.build_examples }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        build_type: [ Debug, Release ]
        build_examples: [ ON, OFF ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_EXAMPLES=${{ matrix.build_examples }}
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      - name: Configure package consumer
        run: >
          cmake -S .github/ci/package-consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build package consumer
        run: cmake --build consumer-build --config ${{ matrix.build_type }} --parallel

      - name: Test package consumer
        run: ctest --test-dir consumer-build -C ${{ matrix.build_type }} --output-on-failure
